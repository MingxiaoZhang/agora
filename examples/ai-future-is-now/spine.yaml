# Example spine for 《AI未来已来》 by 李开复 (Kai-Fu Lee).
# Built from the public distilled-skill repo
# https://github.com/Grruuu/ai-future-is-now-skill, not from the full text.
# Claims are paraphrased from that repo; check them against the book before relying on them.

source:
  title: "AI未来已来：CEO、组织、个人的时代红利"
  author: "李开复 (Kai-Fu Lee)"
  spoken_name: "Kai-Fu Lee's book on AI in companies"
  kind: book
  published: 2026
  language: zh
  author_context: >
    The author founded and runs an AI company whose enterprise products match
    systems the book recommends; the distillation flags this as a product-narrative risk.
    The distillation also notes the book tends to explain every failed transformation
    as "wrong order" rather than a limit of the technology, which is hard to falsify.
  notes: "Built from a distilled skill repo, not the full text."

order: idea

units:
  - id: ch09
    title: "Two maps: is my job still safe? / Three directions"
    location: "Chapter 9"
    status: in-progress
    claims:
      - text: >
          Work can be placed on two axes: whether it has a standard right answer,
          and whether its value depends on a particular person being present and answerable.
        contestable_because: "Neither axis is measurable; the same job can land differently in different orgs."
      - text: >
          Knowledge work turned out more automatable, and hands-on work less, than people expected a decade ago.
        contestable_because: "Depends heavily on which tasks and how far ahead you look."
      - text: >
          Value gathers where someone must answer for the outcome when things go wrong.
        contestable_because: "Assumes organizations pay a premium for taking accountability."
    general_ideas:
      - "Which kinds of work does AI take over first, and why does that differ from human intuitions about difficulty?"
      - "Who is accountable when work is automated, and does accountability disappear, move, or become a formality?"
      - "When a human stays in the loop only to sign off, are they making judgments or absorbing blame?"
    checkable:
      - claim: "Customer-support AI helps novices far more than experts."
        consensus: unknown
        checked: null
        sources: []
    weaknesses:
      - "The map is a snapshot; the author admits an earlier version (creativity as a safe zone) was wrong."
      - "'Move toward accountability' assumes the org rewards it, not just punishes errors."
      - "If everyone moves toward the same scarce roles, the premium may vanish (not discussed)."
    hooks:
      - format: predict-and-commit
        headline: "The safest part of your job probably isn't the part you think."
        activity: >
          Pick the two tasks from your week you'd most hate to lose. For each, give the
          percent chance AI does it as well as you within three years, and say whether it
          needs you in particular, and why.
        debrief_angle: >
          Separate how hard a task is for AI from what happens when it goes wrong;
          they are different variables.
        used: 2026-10-08

  - id: ch06-07
    title: "Enterprise decision core and the 'boss AI'"
    location: "Chapters 6–7"
    status: not-started
    claims:
      - text: >
          Information degrades as it moves up management layers: each layer summarizes away
          harsh signals and softens bad news. Leaders should read the raw records that already
          exist (meeting recordings, edit histories, code commits, support tickets) rather than
          dashboards, which show results after the damage is done.
        contestable_because: >
          Reading employees' work traces raises trust and privacy problems, and signals tend to
          get gamed once people know they're watched. The book states limits only as principles.
      - text: >
          Enterprise AI answers wrongly less because information is missing than because the
          answer sits in relationships between facts. The fix is an explicit map of entities,
          relationships and rules that people who know the business can read and edit.
        contestable_because: >
          Who resolves conflicting definitions, versions changes, and catches wrong rules is
          left unanswered, and the engineering cost is not quantified.
    general_ideas:
      - "How should you weigh advice from someone who sells the solution they recommend?"
      - "What makes an organization's knowledge usable by AI: the documents, or the relationships between them?"
      - "Should leaders get the truth by reading people's raw work records, and what would make that legitimate?"
    weaknesses:
      - "The author's company sells the decision-core and 'boss AI' systems these chapters describe."
      - "Evidence comes mostly from large, digitally mature firms."
      - "Almost no cases where such systems caused harm (leaks, wrongful personnel decisions)."
    hooks:
      - format: scene
        target: "Should leaders get the truth by reading people's raw work records, and what would make that legitimate?"
        headline: "Your AI caught a failing launch three weeks early. It did it by reading everyone's meetings. Roll it out?"
        activity: >
          You're the CEO of a 300-person software company deciding whether to roll out an AI
          that reads meeting transcripts, edit histories, commits and tickets to flag trouble
          early. You'll hear from your IT lead, your head of people and an engineering manager,
          then decide: roll it out as is, roll it out with limits you name, or stop the pilot.
        debrief_angle: >
          What did the learner trade off, signal against trust? If they set limits, did those
          answer who audits it, how employees appeal, and how misuse is caught? Push on whether a
          signal survives once people know they're watched.
        scene:
          setting: >
            A fictional 300-person software company. The learner is the CEO. A pilot of an AI that
            reads raw work records caught a slipping product launch three weeks before the numbers
            showed it. The rollout decision is due today.
          roles:
            - name: the IT lead
              position: Roll it out company-wide, as is.
              wants: Early warning before problems reach the numbers.
              knows: >
                The pilot flagged the launch from stalled commits and reopened tickets. It reads
                meeting transcripts, document edit histories, commits and support tickets.
            - name: the head of people
              position: Stop reading meeting transcripts.
              wants: Trust, and keeping senior engineers.
              knows: >
                Two senior engineers have asked whether their meetings feed performance reviews.
                There is no audit or appeal process yet.
            - name: an engineering manager
              position: Somewhere in between.
              wants: Fewer surprise escalations, and a team that still talks openly.
              knows: Since the pilot started, some teams have moved hard conversations to private calls.
          decision: >
            Roll it out as is, roll it out with specific limits (what it reads, who sees it, how
            employees appeal, how misuse is caught), or stop the pilot.
          consequences: >
            As is: useful warnings at first, then the signals weaken as people route around the
            system, and a senior engineer resigns. Specific, auditable limits: a slower rollout and
            a weaker signal, but trust mostly holds. Vague limits play out like "as is". Stopping:
            trust holds, and the next slipping project surfaces late.
          source_contrast: >
            The book recommends leaders read raw work records rather than dashboards, with limits
            stated as principles. The public distillation notes it doesn't say who audits the
            system, how employees appeal, or how misuse is detected, and that signals get gamed
            once used for evaluation. The author's company sells such systems.
      - format: personal memory
        target: "When an AI gets your organization wrong, is the missing piece information or the connections between facts?"
        headline: "Think of the last time an AI confidently got your work wrong. Was the answer missing, or scattered?"
        activity: >
          Recall one specific time an AI tool gave a confident but wrong answer about your own
          work or organization. Decide: was the right answer missing from everything it could
          read, or was it there but spread across several facts no single document connected?
          Commit to one, and name the facts if you can.
        debrief_angle: >
          Surface the learner's own model of why the AI failed. If "scattered": who holds the
          connections, and could they maintain a map of them? If "missing": what does that say
          about the claim that relationships, not information, are the bottleneck?

  - id: transformation
    title: "Why AI transformations fail"
    location: "Various chapters"
    status: not-started
    claims:
      - text: >
          An AI project only counts if you can say which line of the financial statements
          it moves, by how much, and when. Faster work that changes none of them is cosmetic.
        contestable_because: >
          Some value (quality, risk, morale, learning) is real but slow or hard to show
          on financial statements.
      - text: >
          Failed transformations are usually failures of order: the organization flattened
          or automated before it captured its knowledge and redesigned its decisions.
        contestable_because: >
          The book explains nearly every failure this way, including cases a company itself
          attributed to the technology's limits, which makes the claim hard to falsify.
      - text: >
          Projects are often killed quietly by people who never formally object
          (a "pocket veto"), not by open opposition.
        contestable_because: "Hard to observe, so easy to blame after the fact."
    general_ideas:
      - "How do you tell a failed attempt from a hard limit of the technology?"
      - "What evidence would show that an AI project changed the business, not just the workflow?"
      - "When an explanation fits every failure, is that a strength or a warning sign?"
    weaknesses:
      - "Attribution of failures is close to unfalsifiable (flagged by the distillation itself)."
      - "The author's company sells the systems recommended elsewhere in the book."
    hooks:
      - format: forced dilemma
        headline: "A team made contract review 40% faster. Success or failure? You have ninety seconds."
        activity: >
          Decide: success or failure. Then give the one question you would ask the team
          to settle it.
        debrief_angle: >
          What did the learner assume "success" meant? Push toward what would have to change
          in the business, not the workflow, for it to count, and whether that test is fair.
