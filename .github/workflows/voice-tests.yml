name: voice tests

on:
  push:
    paths: ["surfaces/voice/**", "method/**", "formats/**", "examples/**", "templates/**", ".github/workflows/voice-tests.yml"]
  pull_request:
    paths: ["surfaces/voice/**", "method/**", "formats/**", "examples/**", "templates/**", ".github/workflows/voice-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: surfaces/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
