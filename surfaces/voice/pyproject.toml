[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-voice"
version = "0.1.0"
description = "Run Agora learning sessions by voice with an ElevenLabs agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=5.4",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agora-voice = "agora_voice.cli:main"

[tool.setuptools]
packages = ["agora_voice"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
